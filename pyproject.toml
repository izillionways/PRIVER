[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "priver"
version = "0.1.0"
description = "Training-free visual evidence reranking for remote-sensing patches"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Zhengwei Shen", email = "zwshen@zju.edu.cn"},
]
keywords = [
  "remote sensing",
  "vision-language retrieval",
  "patch retrieval",
  "reranking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.24,<2.0",
  "Pillow>=10.0,<12.0",
  "PyYAML>=6.0,<7.0",
  "tqdm>=4.66,<5.0",
]

[project.urls]
Repository = "https://github.com/izillionways/PRIVER"
Issues = "https://github.com/izillionways/PRIVER/issues"

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7,<3.10",
  "pandas>=2.0,<2.3",
  "scikit-learn>=1.3,<1.6",
  "seaborn>=0.13,<0.14",
]
test = [
  "pytest>=8.0,<9.0",
]
vision = [
  "huggingface-hub>=0.23,<1.0",
  "open-clip-torch>=2.24,<3.0",
  "torch>=2.3,<2.6",
  "torchvision>=0.18,<0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
