experiment:
  name: dota_v15_val_458_remoteclip_ck200
  seed: 42
  output_dir: outputs/dota_v15_val_458

dataset:
  name: dota_v1_5
  root: /data/rsdata/DOTA-v1.5/DOTA_V1.5
  split: val
  image_dir: images
  annotation_dir: labelTxt-v1.5/DOTA-v1.5_val
  include_ids_file: splits/dota_v15_test_val_458.txt
  include_difficult: true

queries:
  templates:
    - "Locate image patches containing {class_phrase}."
    - "Find regions that show {class_phrase}."
    - "Retrieve local areas containing {class_phrase}."
    - "Which image regions contain {class_phrase}?"
  min_objects_per_query: 1

tiling:
  patch_sizes: [512, 1024]
  overlap: 0.25
  min_valid_ratio: 0.25
  min_object_coverage: 0.3
  object_coverage_geometry: polygon

retrieval:
  encoder: remoteclip
  output_name: retrieval_remoteclip_ck200
  model_name: ViT-B-32
  pretrained: null
  hf_repo_id: chendelong/RemoteCLIP
  hf_filename: RemoteCLIP-ViT-B-32.pt
  patch_cache_prefix: patch_remoteclip_vit_b32
  query_cache_prefix: query_remoteclip_vit_b32
  batch_size: 128
  candidate_k: 200
  top_k: 10
  device: cuda
  cache_features: true
  cache_dir: features
